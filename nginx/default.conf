# Nginx Reverse Proxy Configuration for Scribble Royale with WebSocket Support
# Replace your-domain.com with your actual domain or EC2 Public IP / DNS

server {
    listen 80;
    server_name your-domain.com; # or _ if accessing via raw IP

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Backend API & WebSocket & Frontend (served through Node)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        
        # Zero-latency WebSocket delivery (disables TCP & proxy packet buffering)
        proxy_buffering off;
        tcp_nodelay on;
        proxy_cache_bypass $http_upgrade;

        # Essential headers for WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Forward client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts (prevent disconnects on idle)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
